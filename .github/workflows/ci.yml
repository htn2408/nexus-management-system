name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit & authorization tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test


  frontend-react:
    name: React frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build

  e2e:
    name: End-to-end (SQL Server + MongoDB)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Kéo image trước để thời gian tải không tính vào thời gian chờ SQL Server khởi động.
      - run: docker pull mcr.microsoft.com/mssql/server:2022-latest && docker pull mongo:7.0
      - run: npm run test:e2e
